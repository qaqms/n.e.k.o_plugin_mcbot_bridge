# Test configuration lives here rather than in the repository's pyproject.toml
# on purpose.
#
# The plugin repository root is itself the plugin module (its ``__init__.py`` is
# the entry point named by ``plugin.toml``). With pytest's ini file at the repo
# root, the root becomes the rootdir, pytest resolves it as a Python package and
# imports ``__init__.py`` as a test module — which fails, because a module
# imported that way has no parent package for its relative imports. Every test
# under tests/ then errors out at setup, including ones that import nothing.
#
# Anchoring the ini file inside tests/ keeps the rootdir here, so the plugin
# entry module is never mistaken for a test module.

[pytest]
asyncio_mode = auto
testpaths = .